<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2700" role="img" aria-labelledby="title desc">
  <title id="title">基于时间重分配的质点时间最优轨迹生成方法总体流程图</title>
  <desc id="desc">从输入、候选速度层构建、候选边共同时间判定，到动态规划、回溯和解析重构的流程图。</desc>
  <style>
    .node { fill:#fff; stroke:#000; stroke-width:3; }
    .flow { fill:none; stroke:#000; stroke-width:3; marker-end:url(#arrow); }
    .loop { fill:none; stroke:#000; stroke-width:3; marker-end:url(#arrow); }
    .label { font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size:32px; fill:#000; text-anchor:middle; }
    .small { font-size:28px; }
    .branch { font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif; font-size:28px; fill:#000; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="2700" fill="#fff"/>

  <!-- Main vertical flow -->
  <rect class="node" x="600" y="70" width="400" height="90" rx="45" ry="45"/>
  <text class="label" x="800" y="126">开始</text>

  <polygon class="node" points="220,210 1350,210 1380,350 250,350"/>
  <text class="label small" x="800" y="289">输入航点、参考方向、端点速度、候选速度幅值及各轴加速度边界</text>

  <rect class="node" x="175" y="410" width="1250" height="100"/>
  <text class="label" x="800" y="472">输入合法性与退化情形检查</text>

  <rect class="node" x="175" y="570" width="1250" height="100"/>
  <text class="label" x="800" y="632">构建各航点的候选速度层</text>

  <rect class="node" x="175" y="730" width="1250" height="100"/>
  <text class="label" x="800" y="792">枚举相邻层候选节点对</text>

  <rect class="node" x="175" y="890" width="1250" height="120"/>
  <text class="label" x="800" y="963">求解三个坐标轴的单轴最短转移时间</text>

  <rect class="node" x="175" y="1070" width="1250" height="120"/>
  <text class="label" x="800" y="1143">取各轴最短时间的最大值作为公共时间下界</text>

  <polygon class="node" points="800,1250 1050,1340 800,1430 550,1340"/>
  <text class="label" x="800" y="1330">三轴共同时间是否可行？</text>

  <!-- Feasibility branches -->
  <rect class="node" x="100" y="1290" width="390" height="100"/>
  <text class="label small" x="295" y="1350">删除对应有向边</text>

  <rect class="node" x="1080" y="1270" width="450" height="140" aria-label="保存边持续时间、切换时刻和缩放系数"/>
  <text class="label small" x="1305" y="1330">保存边持续时间、</text>
  <text class="label small" x="1305" y="1370">切换时刻和缩放系数</text>

  <polygon class="node" points="800,1550 1060,1660 800,1770 540,1660"/>
  <text class="label" x="800" y="1650">相邻层候选边是否全部处理完成？</text>

  <rect class="node" x="175" y="1820" width="1250" height="100"/>
  <text class="label" x="800" y="1882">在分层有向无环图上执行动态规划</text>

  <rect class="node" x="175" y="1980" width="1250" height="100"/>
  <text class="label" x="800" y="2042">回溯获得最优候选速度序列</text>

  <rect class="node" x="175" y="2140" width="1250" height="120"/>
  <text class="label" x="800" y="2213">依据已验证的同一组边参数进行分段解析重构</text>

  <polygon class="node" points="220,2330 1350,2330 1380,2470 250,2470"/>
  <text class="label" x="800" y="2413">补入终端状态并输出位置、速度、加速度及时间序列</text>

  <rect class="node" x="600" y="2560" width="400" height="90" rx="45" ry="45"/>
  <text class="label" x="800" y="2616">结束</text>

  <!-- Main-flow connectors -->
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 160 V210"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 350 V410"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 510 V570"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 670 V730"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 830 V890"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 1010 V1070"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 1190 V1250"/>

  <!-- Feasibility decision, branch merge, and candidate-edge decision -->
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M550 1340 H490"/>
  <text class="branch" x="510" y="1322">否</text>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M1050 1340 H1080"/>
  <text class="branch" x="1058" y="1322">是</text>
  <path class="flow" style="marker-end:none" d="M295 1390 V1500 H800"/>
  <path class="flow" style="marker-end:none" d="M1305 1410 V1500 H800"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 1500 V1550"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 1770 V1820"/>
  <text class="branch" x="823" y="1805">是</text>

  <!-- Candidate-edge loop, routed outside every node -->
  <path class="loop" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M540 1660 H50 V780 H175"/>
  <text class="branch" x="68" y="1190">否</text>

  <!-- Final main-flow connectors -->
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 1920 V1980"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 2080 V2140"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 2260 V2330"/>
  <path class="flow" marker-end="url(#arrow)" style="marker-end:url(#arrow)" d="M800 2470 V2560"/>
</svg>
